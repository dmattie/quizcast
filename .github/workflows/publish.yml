# Build the container in GitHub's cloud and publish it to GHCR.
#
# This exists because ACR Tasks (the `az acr build` cloud builder) is switched
# off on student, free and sponsored Azure subscriptions. Building here needs
# no Docker on your laptop and no Azure build quota.
name: Publish image

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # linux/amd64 explicitly: Azure Container Apps runs amd64, and an arm64
      # image is accepted by the registry and then fails at startup.
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the image actually boots before it gets anywhere near a lecture
      # theatre. A container that starts but never serves is the failure mode
      # that only shows up in front of the room.
      - name: Smoke test the published image
        run: |
          IMG="ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}"
          docker run -d --name quizcast -p 8000:8000 \
            -e QUIZCAST_ADMIN_KEY=ci-admin -e QUIZCAST_PRESENT_KEY=ci-screen "$IMG"
          ok=0
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:8000/; then ok=1; break; fi
            sleep 2
          done
          docker logs quizcast
          test "$ok" = 1

      - name: Where it went
        run: |
          echo "Image: ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
